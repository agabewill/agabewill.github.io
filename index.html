	<link rel="preload" href="2026/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>

	<style>
		@font-face {
			font-family: "IBM Plex Sans";
			font-style: normal;
			font-weight: 400;
			font-display: swap;
			src: url(2026/ibm-plex-sans-400.woff2) format("woff2");
		}

		:root {
			--background: #fff;
			--text: rgba(0, 0, 0, 0.7);
			--text-muted: rgba(0, 0, 0, 0.55);
			--accent: #4a4af4;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--background: #333;
				--text: rgba(255, 255, 255, 0.9);
				--text-muted: rgba(255, 255, 255, 0.55);
				--accent: #a8a9fc;
			}
		}

		* { box-sizing: border-box; margin: 0; }

		body {
			min-height: 100vh;
			min-height: 100svh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: var(--background);
			color: var(--text);
			font: 24px/1.5 "IBM Plex Sans", system-ui, -apple-system, sans-serif;
			text-align: center;
			-webkit-text-size-adjust: 100%;
		}

		main {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 32px;
			width: 100%;
			max-width: 1200px;
		}

		.portrait {
			display: block;
			width: 64px;
			height: 64px;
			border-radius: 50%;
		}

		.intro {
			display: flex;
			flex-direction: column;
			gap: 24px;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		a:hover,
		a:focus-visible {
			text-decoration: underline;
		}

		.employer { color: var(--accent); }

		s { color: var(--text-muted); }

		.links {
			display: flex;
			justify-content: center;
			gap: 8px;
			font-size: 16px;
			line-height: 24px;
			color: var(--text-muted);
		}

		.links a { color: var(--text-muted); }

		@media (min-width: 768px) {
			.portrait {
				width: 128px;
				height: 128px;
			}

			.intro { font-size: 32px; }

			.location { display: block; }

			.links { font-size: 20px; }
		}
	</style>
</head>
<body>

	<main>
		<img src="2026/avatar@2x.jpg" class="portrait" width="128" height="128" alt="A portrait of Gabe, smiling and wearing a light hooded jacket with the hood up, outdoors under a cloudy sky." fetchpriority="high">

		<div class="intro">
			<p>
				Hi, I’m Gabe. I’m a product designer focused on building experiences for businesses of all sizes. I’m currently at <a href="https://www.affirm.com/" class="employer">Affirm</a> <s>Engine</s> <s>Square</s> <s>Mailchimp</s>.
				<span class="location">I’m based out of Berkeley, California.</span>
			</p>

			<p class="links">
				<a href="https://www.linkedin.com/in/gabewill/">LinkedIn</a>
				<span aria-hidden="true">·</span>
				<a href="2026/gabe-will-resume.pdf">Resume</a>
				<span aria-hidden="true">·</span>
				<a href="mailto:agabewill@gmail.com">Email</a>
			</p>
		</div>
	</main>

</body>
</html>
